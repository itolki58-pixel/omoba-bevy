name: Zargat server build

on:
  push:
    branches: [fix/quick-matchmaking-50s]
    paths:
      - "shared/**"
      - "common/**"
      - "server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/zargat-server.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux-x64:
    name: Linux x64 server
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: zargat-server-linux-x64
      - name: Refresh compatibility manifest and lockfile
        run: cargo run --quiet -p shared --example compatibility -- manifest
      - name: Build server
        run: cargo build --locked --release -p server
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: omoba-zargat-server-linux-x64
          path: target/release/server
          if-no-files-found: error
