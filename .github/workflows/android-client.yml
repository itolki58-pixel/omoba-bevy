# Rebuild after Zargat rig bone validation fix
name: Android client APK

on:
  push:
    branches:
      - fix/quick-matchmaking-50s
    paths:
      - "client/**"
      - "shared/**"
      - "scripts/generate_zargat.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-client.yml"
  pull_request:
    paths:
      - "client/**"
      - "shared/**"
      - "scripts/release.py"
      - "mobile/android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:
    inputs:
      server:
        description: "Optional initial game server host:port"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_SERVER: ${{ github.event.inputs.server || vars.OMOBA_RELEASE_SERVER }}

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-client-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Generate standalone Zaragat model and rig
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglib2.0-0
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          rm -f client/assets/avatars/zargat.glb
          blender --background --python scripts/generate_zargat.py
          test -s client/assets/avatars/zargat.glb
          test -s client/assets/avatars/zargat.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path("client/assets/avatars/zargat.png").read_bytes()
          assert data[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), "Invalid Zargat portrait PNG"
          width, height = struct.unpack_from(">II", data, 16)
          assert width >= 512 and height >= 512, f"Portrait is too small: {width}x{height}"
          print(f"Validated Zargat portrait: {width}x{height}")
          PY
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          path = Path("client/assets/avatars/zargat.glb")
          data = path.read_bytes()
          magic, version, total = struct.unpack_from("<4sII", data, 0)
          assert magic == b"glTF" and version == 2 and total == len(data), "Invalid GLB header"
          chunk_len, chunk_type = struct.unpack_from("<II", data, 12)
          assert chunk_type == 0x4E4F534A, "Missing GLB JSON chunk"
          doc = json.loads(data[20:20 + chunk_len].decode("utf-8"))
          assert doc.get("meshes"), "Zaragat GLB has no meshes"
          assert doc.get("skins"), "Zaragat GLB has no independent armature/skin"
          names = [a.get("name", "") for a in doc.get("animations", [])]
          required = {"Idle", "Run", "Walk", "Attack", "Cast", "Death", "Hit", "TurnLeft", "TurnRight", "Stop", "Ultimate"}
          missing = required - set(names)
          assert not missing, f"Missing Zaragat animation clips: {sorted(missing)}"
          node_names = {node.get("name", "") for node in doc.get("nodes", [])}
          required_bones = {"jaw", "neck", "finger.1.L", "finger.2.L", "finger.3.L", "finger.1.R", "finger.2.R", "finger.3.R"}
          missing_bones = required_bones - node_names
          assert not missing_bones, f"Missing Zaragat rig bones: {sorted(missing_bones)}"
          print(f"Validated Zaragat GLB: {path.stat().st_size} bytes; meshes={len(doc['meshes'])}; skins={len(doc['skins'])}; bones={len(node_names)}; animations={names}")
          PY
      - name: Refresh compatibility manifest and lockfile
        run: cargo run --quiet -p shared --example compatibility -- manifest
      - name: Build Android client
        env:
          OMOBA_ANDROID_KEYSTORE_BASE64: ${{ secrets.OMOBA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          args=(build android --out dist)
          if [ -n "$RELEASE_SERVER" ]; then args+=(--server "$RELEASE_SERVER"); fi
          python3 scripts/release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omoba-android-arm64
          path: dist/*/*.apk
          if-no-files-found: error
