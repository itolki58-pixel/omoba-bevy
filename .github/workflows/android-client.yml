name: Android client APK

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Optional default game server host:port"
        required: false
        default: ""
  pull_request:
    paths:
      - "client/**"
      - "shared/**"
      - "mobile/android/**"
      - "scripts/release.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-client.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-client-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Refresh compatibility manifest and lockfile
        run: cargo run --quiet -p shared --example compatibility -- manifest
      - name: Build Android package
        env:
          OMOBA_ANDROID_KEYSTORE_BASE64: ${{ secrets.OMOBA_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_SERVER: ${{ github.event.inputs.server }}
        run: |
          args=(build android --out dist)
          if [ -n "$RELEASE_SERVER" ]; then args+=(--server "$RELEASE_SERVER"); fi
          python3 scripts/release.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omoba-android-arm64
          path: dist/*/*.apk
          if-no-files-found: error
